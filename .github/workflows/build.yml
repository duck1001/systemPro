name: Build

permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.scheme }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        # roothide 需要 roothide/theos 分支，用独立 job 处理（见仓库说明）；默认只出 rootless
        scheme: [ rootless ]
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid xz

      - name: Fetch Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          rm -rf "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Build package
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }}

      - name: Show package
        run: ls -la packages/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: systemPro-${{ matrix.scheme }}-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
          name: systemPro ${{ github.ref_name }}
          body: |
            systemPro 自动打包（${{ matrix.scheme }}）。
            安装：Filza / Sileo / dpkg -i systemPro_*.deb
